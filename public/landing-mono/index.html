<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Nitro — Monochrome 3D Concepts</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f4f4f4;font-family:Arial,sans-serif}.hero{padding:70px 4vw 35px;max-width:1600px;margin:auto}.hero small{color:#777;letter-spacing:.18em}.hero h1{font-size:clamp(55px,8vw,120px);line-height:.82;letter-spacing:-.07em;margin:18px 0}.hero h1 span{background:linear-gradient(#fff,#777 48%,#eee);-webkit-background-clip:text;color:transparent}.hero p{max-width:800px;color:#999;font-size:18px;line-height:1.6}.grid{max-width:1700px;margin:auto;padding:25px 3vw 100px;display:grid;grid-template-columns:repeat(2,1fr);gap:26px}.card{border:1px solid #292929;background:#0b0b0b}.preview{height:570px;overflow:hidden;background:#000}.preview iframe{width:1440px;height:1150px;border:0;transform:scale(.5);transform-origin:top left;pointer-events:none}.meta{padding:22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.meta h2{margin:0 0 7px}.meta p{margin:0;color:#777}.meta a{background:#eee;color:#000;padding:13px 18px;font-weight:900;text-decoration:none;border-radius:999px}@media(max-width:1100px){.grid{grid-template-columns:1fr}.preview{height:500px}.preview iframe{transform:scale(.44)}}@media(max-width:650px){.preview{height:380px}.preview iframe{transform:scale(.32)}.meta{display:block}.meta a{display:inline-block;margin-top:16px}}</style></head><body><header class="hero"><small>⚡ NITRO OUTREACH / MONOCHROME 3D STUDIES</small><h1>BLACK BASE.<br><span>10 DIFFERENT WORLDS.</span></h1><p>Every preview below is the actual full landing page rendered at scale. Same monochrome Nitro universe, completely different spatial concept and page composition.</p></header><main id="grid" class="grid"></main><script>const names=['The Growth Room','Exploded Stack','Content Object','Infinite Funnel','Business Orbit','The Monolith','Stacked Reality','Product Carousel','Growth Engine','One Platform Sculpture'];const notes=['Suspended workspace in a black 3D room','Nitro tools orbit and explode around one core','Chrome phone + Reel generation scene','Perspective tunnel from prospect to conversion','Nitro dashboard as center of a business orbit','Rotating solid product monolith','Four product layers floating in depth','Rotating 3D product surfaces','Mechanical system turning goals into output','Sculptural final composition of the whole stack'];document.getElementById('grid').innerHTML=names.map((x,i)=>`<article class="card"><div class="preview"><iframe src="/landing-mono/${String(i+1).padStart(2,'0')}/" loading="lazy"></iframe></div><div class="meta"><div><h2>${String(i+1).padStart(2,'0')} — ${x}</h2><p>${notes[i]}</p></div><a href="/landing-mono/${String(i+1).padStart(2,'0')}/">OPEN FULL PAGE ↗</a></div></article>`).join('')</script></body></html>
