<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nitro — 10 Actual Landing Pages</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}.head{padding:55px 4vw 30px;max-width:1600px;margin:auto}.head h1{font-size:clamp(48px,7vw,100px);line-height:.9;letter-spacing:-.06em;margin:20px 0}.head h1 span{color:#ff6b2c}.head p{color:#aaa;max-width:850px;font-size:18px;line-height:1.6}.grid{padding:25px 3vw 100px;display:grid;grid-template-columns:repeat(2,1fr);gap:26px;max-width:1700px;margin:auto}.card{background:#1a1a1a;border:1px solid #333}.screen{height:560px;background:#fff;overflow:hidden;position:relative}.screen iframe{width:1440px;height:1100px;border:0;transform:scale(.5);transform-origin:top left;pointer-events:none}.meta{padding:20px;display:flex;justify-content:space-between;align-items:center;gap:20px}.meta h2{margin:0 0 5px}.meta p{margin:0;color:#888}.meta a{background:#fff;color:#111;padding:12px 18px;text-decoration:none;font-weight:800}@media(max-width:1100px){.grid{grid-template-columns:1fr}.screen{height:500px}.screen iframe{transform:scale(.45)}}@media(max-width:650px){.screen{height:390px}.screen iframe{transform:scale(.32)}.meta{display:block}.meta a{display:inline-block;margin-top:15px}}</style></head><body><header class="head"><b>⚡ NITRO OUTREACH / ACTUAL PAGE PREVIEWS</b><h1>Ten actual websites.<br><span>Not ten preview cards.</span></h1><p>Every window below is a scaled live rendering of the full landing page. Each concept uses the real Nitro product story, product UI, signup flow, feature depth and conversion content.</p></header><main class="grid" id="grid"></main><script>const names=['Performance / Racing','Ultra-Minimal Editorial','Futuristic Control Room','Bold Startup Collage','Premium Enterprise','Modern Brutalist','Gradient / Glass','Storytelling Journey','Product-First Tour','Experimental Nitro'];const notes=['Aggressive split hero + telemetry','Magazine composition + manifesto','Sidebar command center + live signals','Oversized collage + tilted product','Executive report + structured capability model','Hard grid + raw product demo','Layered floating interface','Full-page narrative chapters','Interface-led walkthrough','Overlaps + horizontal rails'];document.getElementById('grid').innerHTML=names.map((x,i)=>`<article class="card"><div class="screen"><iframe src="/landing-real.html?v=${i+1}" loading="lazy"></iframe></div><div class="meta"><div><h2>0${i+1} — ${x}</h2><p>${notes[i]}</p></div><a href="/landing-real.html?v=${i+1}">OPEN FULL PAGE ↗</a></div></article>`).join('')</script></body></html>
