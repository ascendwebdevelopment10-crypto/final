<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Nitro Outreach Landing Concept</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>html,body{margin:0;min-height:100%;background:#090909}*{box-sizing:border-box}button,input{font:inherit}a{text-decoration:none}#concept-root{min-height:100vh}.lab-switcher{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;align-items:center;gap:7px;padding:8px;background:rgba(10,10,10,.82);border:1px solid rgba(255,255,255,.15);border-radius:14px;backdrop-filter:blur(16px);box-shadow:0 15px 50px rgba(0,0,0,.35)}.lab-switcher a{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;color:#aaa;font:600 12px Inter,sans-serif}.lab-switcher a:hover,.lab-switcher a.active{background:#fff;color:#111}.lab-switcher .all{width:auto;padding:0 10px}@media(max-width:700px){.lab-switcher{left:8px;right:8px;overflow:auto;justify-content:flex-start}.lab-switcher a{flex:0 0 auto}}
  </style>
</head>
<body>
  <div id="concept-root"></div>
  <script type="module" src="/landing-lab.js"></script>
</body>
</html>
