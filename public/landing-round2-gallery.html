<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nitro Round Two</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Manrope:wght@600;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#111;font-family:Inter}.top{padding:55px 4vw 35px;max-width:1400px;margin:auto}.top h1{font:800 clamp(50px,7vw,95px)/.92 Manrope;letter-spacing:-.06em;max-width:1100px}.top h1 span{color:#ff5b32}.top p{max-width:800px;color:#64656a;line-height:1.7}.grid{max-width:1400px;margin:auto;padding:20px 4vw 90px;display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.card{background:#fff;border:1px solid #d4d2cb}.preview{height:330px;position:relative;padding:24px;overflow:hidden}.preview h2{font-size:48px;line-height:.88;max-width:75%;margin-top:60px}.preview .shape{position:absolute;right:25px;bottom:25px;width:35%;height:45%;border:2px solid currentColor}.p1{background:#08090b;color:#c7ff00}.p1 h2{font-family:Impact;text-transform:uppercase}.p1 .shape{clip-path:polygon(10% 0,100% 0,100% 85%,88% 100%,0 100%,0 12%);background:#16191d}.p2{background:#f6f1e8;color:#171310}.p2 h2{font-family:Georgia;font-weight:500}.p2 .shape{border:0;border-left:1px solid #aaa;background:#e8ded0}.p3{background:#04101e;color:#35ddff;background-image:linear-gradient(#35ddff18 1px,transparent 1px),linear-gradient(90deg,#35ddff18 1px,transparent 1px);background-size:25px 25px}.p4{background:#ffdc18;color:#111}.p4 .shape{background:#ff4c9b;border:4px solid #111;transform:rotate(7deg)}.p5{background:#f3eee2;color:#122944}.p5 h2{font-family:Georgia}.p5 .shape{background:#102b4b;color:#fff;border:0;box-shadow:12px 12px 0 #c6a66a}.p6{background:#f4ff20;color:#000;border:4px solid #000}.p6 .shape{background:#ff5b30;border:4px solid #000}.p7{background:radial-gradient(circle at 25% 25%,#6b38ff,transparent 35%),radial-gradient(circle at 75% 25%,#20d9ff,transparent 30%),#090713;color:#fff}.p7 .shape{background:#ffffff20;border-color:#ffffff55;border-radius:25px;backdrop-filter:blur(12px)}.p8{background:#efe3cf;color:#193c30}.p8 h2{font-family:Georgia}.p8 .shape{background:#c96849;border:0;border-radius:50% 50% 0 0}.p9{background:#f4f4f1;color:#161616}.p9 .shape{background:#1c1e22;border:0;border-radius:12px}.p10{background:#d8d5cc;color:#111}.p10 h2{font-size:54px;text-transform:uppercase}.p10 .shape{background:#ff5b32;transform:rotate(8deg)}.meta{padding:22px;display:flex;justify-content:space-between;gap:20px}.meta h3{margin:0 0 8px}.meta p{margin:0;color:#6b6d72;font-size:13px}.open{background:#111;color:#fff;padding:12px 15px;text-decoration:none;font-weight:800;align-self:center}@media(max-width:850px){.grid{grid-template-columns:1fr}.preview{height:280px}.preview h2{font-size:42px}}</style></head><body><header class="top"><b>⚡ NITRO OUTREACH / ROUND TWO</b><h1>Same product. <span>Ten entirely different websites.</span></h1><p>This round includes the full Nitro product story in every concept, but changes the copy, visual hierarchy, information order, hero construction, feature treatment, product demonstration, CTA flow and typography.</p></header><main class="grid" id="grid"></main><script>const names=['Nitro Performance','Ultra Minimal','Control Center','Bold Startup','Premium Enterprise','Modern Brutalist','Gradient / Glass','Storytelling Journey','Product-First','Experimental Nitro'];const titles=['Find. Create. Accelerate.','Less software. More business.','Control every growth signal.','Make noise. Get noticed. Grow.','A clearer operating system for acquisition.','One tool. All the work.','Turn scattered effort into momentum.','You started a business. Marketing took over.','Explore the system before signing up.','Ten tools. Now one.'];document.getElementById('grid').innerHTML=names.map((x,i)=>`<article class="card"><div class="preview p${i+1}"><b>0${i+1} / ${x}</b><h2>${titles[i]}</h2><div class="shape"></div></div><div class="meta"><div><h3>${x}</h3><p>Unique structure, copy, typography and product story.</p></div><a class="open" href="/landing-round2.html?c=${i+1}">OPEN ↗</a></div></article>`).join('')</script></body></html>
